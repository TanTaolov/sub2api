name: Profit URL remarks regression
on:
  push:
    branches: [feat/profit-url-channel-remarks]
  pull_request:
    paths:
      - '**/profit_url_remarks*'
      - '**/profit_operations*'
      - '**/ProfitURLRemarks*'
      - '**/ProfitOperations*'
      - '**/ProfitAnalytics*'
      - '**/UpstreamURLRemarkEditor*'
      - 'backend/migrations/312_upstream_url_channel_remarks.sql'
      - 'backend/internal/server/routes/admin.go'
      - 'backend/internal/server/middleware/audit_log.go'
      - 'frontend/src/api/admin/profitOperations.ts'
      - 'frontend/src/i18n/locales/*/profitOps.ts'
      - '.github/workflows/profit-url-remarks-regression.yml'
      - '.github/scripts/upstream-profit-operations-screenshot.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: git rev-parse HEAD
      - name: DTO, URL identity and actual admin route authorization
        working-directory: backend
        run: go test -tags=unit ./internal/service ./internal/handler/admin ./internal/server/routes -run '^TestProfit(URLRemarks|Operations)' -count=1 -v
      - name: Persistence regression RED against discarded notes
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          target=internal/repository/profit_url_remarks.go
          cp "$target" "$RUNNER_TEMP/profit-url-current.go"
          trap 'cp "$RUNNER_TEMP/profit-url-current.go" "$target"' EXIT
          python3 - <<'PYRED'
          from pathlib import Path
          p=Path('internal/repository/profit_url_remarks.go')
          s=p.read_text()
          assert 'm.Upstream, m.Remark).Scan' in s
          p.write_text(s.replace('m.Upstream, m.Remark).Scan', 'm.Upstream, "").Scan'))
          PYRED
          set +e
          go test -tags=integration ./internal/repository -run '^TestProfitURLRemarksHTTPPostgresPersistenceIdentityAuditAndConcurrency$' -count=1 -v > "$RUNNER_TEMP/profit-url-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/profit-url-red.log"
          test "$result" -ne 0
          grep -q 'FAIL: TestProfitURLRemarksHTTPPostgresPersistenceIdentityAuditAndConcurrency' "$RUNNER_TEMP/profit-url-red.log"
          grep -q 'API must persist the submitted note' "$RUNNER_TEMP/profit-url-red.log"
      - name: Real API to private migrated PostgreSQL to GET; existing profit and URL regressions
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          go test -tags=integration ./internal/repository -run '^Test(ProfitURLRemarks|ProfitOperations|UpstreamOperations)' -count=1 -v | tee "$RUNNER_TEMP/profit-url-green.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: profit-url-postgres-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/profit-url-*.log
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Actual profit page and remark editor components
        working-directory: frontend
        run: pnpm exec vitest run src/views/admin/__tests__/ProfitOperationsView.spec.ts src/views/admin/__tests__/ProfitURLRemarks.spec.ts src/views/admin/__tests__/ProfitURLRemarksAPI.spec.ts --maxWorkers=1 --minWorkers=1 --no-file-parallelism
      - run: pnpm --dir frontend run build
      - name: Install isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/profit-url-browser" --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/profit-url-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exact profit page browser with synthetic data
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/profit-url-browser/node_modules/playwright
          UPSTREAM_SCREENSHOT_DIR: ${{ runner.temp }}/profit-url-screenshots
        run: node .github/scripts/upstream-profit-operations-screenshot.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: profit-url-ui-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/profit-url-screenshots
