name: PR598 repair regression

on:
  push:
    branches: [feat/priority-scheduling-latency-sticky]
  pull_request:
    paths:
      - 'backend/internal/service/priority*'
      - 'backend/internal/repository/priority*'
      - 'frontend/src/views/admin/PrioritySchedulingView.vue'
      - 'frontend/src/views/admin/__tests__/PrioritySchedulingView.spec.ts'
      - '.github/workflows/pr598-repair-regression.yml'

permissions:
  contents: read

jobs:
  service-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Record expected service RED
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr598-red"
          set +e
          (cd backend && go test -tags=unit ./internal/service ./internal/handler -run '^TestPriority(LatencySeriesNoHistorySerializesEmptyBuckets|RecomputeDoesNotTreatHistoryErrorAsSuccess|LatencySeriesHandlerUsesEmptyArrayForNoHistory)$' -count=1 -v -timeout=5m) > "$RUNNER_TEMP/pr598-red/service.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/pr598-red/service.log"
          test "$result" -ne 0
          grep -q -- 'FAIL: TestPriorityLatencySeriesNoHistorySerializesEmptyBuckets' "$RUNNER_TEMP/pr598-red/service.log"
          grep -q -- 'FAIL: TestPriorityRecomputeDoesNotTreatHistoryErrorAsSuccess' "$RUNNER_TEMP/pr598-red/service.log"
          grep -q -- 'FAIL: TestPriorityLatencySeriesHandlerUsesEmptyArrayForNoHistory' "$RUNNER_TEMP/pr598-red/service.log"
          ! grep -Eq 'build failed|undefined:|no tests to run|panic:' "$RUNNER_TEMP/pr598-red/service.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr598-red-service-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/pr598-red/service.log
          if-no-files-found: error

  repository-red:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Record expected isolated PostgreSQL RED
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr598-red"
          set +e
          (cd backend && go test -tags=integration ./internal/repository -run '^TestPriorityLatencySeriesErrorsOnlyBucket$' -count=1 -v -timeout=15m) > "$RUNNER_TEMP/pr598-red/repository.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/pr598-red/repository.log"
          test "$result" -ne 0
          grep -q -- 'FAIL: TestPriorityLatencySeriesErrorsOnlyBucket' "$RUNNER_TEMP/pr598-red/repository.log"
          ! grep -Eq 'build failed|undefined:|no tests to run|panic:|--- SKIP:' "$RUNNER_TEMP/pr598-red/repository.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr598-red-repository-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/pr598-red/repository.log
          if-no-files-found: error

  ui-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Record expected Vue RED
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr598-red"
          set +e
          pnpm --dir frontend exec vitest run src/views/admin/__tests__/PrioritySchedulingView.spec.ts --maxWorkers=1 --minWorkers=1 > "$RUNNER_TEMP/pr598-red/ui.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/pr598-red/ui.log"
          test "$result" -ne 0
          grep -q -- 'uses the configured percentile in every heatmap bucket' "$RUNNER_TEMP/pr598-red/ui.log"
          grep -q -- 'drops sticky rows as soon as the selected group changes' "$RUNNER_TEMP/pr598-red/ui.log"
          grep -q -- 'clears changed sticky rows in the recompute result scope' "$RUNNER_TEMP/pr598-red/ui.log"
          ! grep -Eq 'Failed to resolve|SyntaxError|No test files found' "$RUNNER_TEMP/pr598-red/ui.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr598-red-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/pr598-red/ui.log
          if-no-files-found: error
